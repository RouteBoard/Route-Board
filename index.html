<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dispatch Desk - Kathmandu Valley</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; background: #f8fafc; color: #1e293b; }
    h3 { margin-top: 0; }
    .container { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
    .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; }
    #map { width: 100%; height: 500px; background: #f1f5f9; border-radius: 8px; border: 1px solid #cbd5e1; }
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-located { background: #dcfce7; color: #166534; }
    .status-failed { background: #fee2e2; color: #991b1b; }
    .order-item { border-bottom: 1px solid #f1f5f9; padding: 8px 0; font-size: 14px; }
  </style>
</head>
<body>

<div id="clock">Dispatch Desk</div>

<div class="container">
  <div class="panel">
    <h3>Ready to deliver</h3>
    <div id="import-status"></div>
    <div id="manifest" style="margin-top: 15px;"></div>
  </div>

  <div class="panel">
    <svg id="map"></svg>
  </div>
</div>

<script>
/* ---------- Known Areas Local Table ---------- */
const LOCATION_GROUPS = {
  "Kathmandu — Core": {
    "Thamel": { lat: 27.7154, lng: 85.3123 },
    "Ason": { lat: 27.7057, lng: 85.3096 },
    "Indrachok": { lat: 27.7040, lng: 85.3080 },
    "Kalimati": { lat: 27.6983, lng: 85.3000 },
    "Tripureshwor": { lat: 27.6943, lng: 85.3186 },
    "Teku": { lat: 27.6955, lng: 85.3085 }
  },
  "Lalitpur": {
    "Sankhamul": { lat: 27.6796, lng: 85.3283 },
    "Patan": { lat: 27.6744, lng: 85.3248 },
    "Pulchowk": { lat: 27.6788, lng: 85.3162 }
  }
};

const KNOWN_AREAS = {};
Object.values(LOCATION_GROUPS).forEach(g => Object.entries(g).forEach(([k, v]) => KNOWN_AREAS[k.toLowerCase()] = v));

// Bounding box for Kathmandu Valley: left, top, right, bottom
const VALLEY_VIEWBOX = "85.15,27.85,85.55,27.55";

/* ---------- State ---------- */
let orders = [];
const geocodeCache = new Map(); // normalized text -> {lat,lng} | 'failed'
let geocodeQueue = [];
let geocodeBusy = false;

/* ---------- Geocoding Logic ---------- */
function normalizeKey(text) {
  return (text || "").toLowerCase().trim();
}

function cleanLocationText(rawText) {
  if (!rawText) return "";
  // Strips landmark notes, parens, and extracts primary neighborhood before commas
  return rawText
    .split(',')[0]
    .replace(/\(.*\)/g, '')
    .trim();
}

function lookupLocal(rawText) {
  const cleaned = cleanLocationText(rawText).toLowerCase();
  for (const [key, coords] of Object.entries(KNOWN_AREAS)) {
    if (cleaned.includes(key) || key.includes(cleaned)) {
      return coords;
    }
  }
  return null;
}

async function geocodeRemote(rawText) {
  const queryText = cleanLocationText(rawText);
  if (!queryText) return null;

  // Added bounded viewbox & contact identity parameter (prevents HTTP 403 blocks)
  const url = `https://nominatim.openstreetmap.org/search?` +
    `format=json` +
    `&q=${encodeURIComponent(queryText + ", Kathmandu Valley, Nepal")}` +
    `&viewbox=${VALLEY_VIEWBOX}` +
    `&bounded=1` +
    `&email=dispatch-app@example.com`;

  try {
    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    if (!res.ok) {
      console.warn(`Nominatim error: HTTP ${res.status}`);
      return null;
    }
    const data = await res.json();
    if (data && data.length > 0) {
      return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
    }
  } catch(e) {
    console.error("Geocoding network exception:", e);
  }
  return null;
}

function queueGeocode(order) {
  const key = normalizeKey(order.loc);
  if (!key) {
    applyResolution(order, null, true);
    return;
  }

  // Check Local Match
  const localCoords = lookupLocal(order.loc);
  if (localCoords) {
    geocodeCache.set(key, localCoords);
    applyResolution(order, localCoords, false);
    return;
  }

  // Check Cache
  if (geocodeCache.has(key)) {
    const cached = geocodeCache.get(key);
    applyResolution(order, cached !== 'failed' ? cached : null, cached === 'failed');
    return;
  }

  geocodeQueue.push(order);
  processGeocodeQueue();
}

async function processGeocodeQueue() {
  if (geocodeBusy || geocodeQueue.length === 0) return;
  geocodeBusy = true;

  while (geocodeQueue.length > 0) {
    const order = geocodeQueue.shift();
    const key = normalizeKey(order.loc);

    if (geocodeCache.has(key)) {
      const cached = geocodeCache.get(key);
      applyResolution(order, cached !== 'failed' ? cached : null, cached === 'failed');
      continue;
    }

    const remoteCoords = await geocodeRemote(order.loc);
    geocodeCache.set(key, remoteCoords || 'failed');
    applyResolution(order, remoteCoords, !remoteCoords);

    // Rate-limiting delay per Nominatim API Terms (~1 request/second)
    await new Promise(r => setTimeout(r, 1100));
  }

  geocodeBusy = false;
  renderManifest();
}

function applyResolution(order, coords, failed) {
  order.coords = coords;
  order.status = coords ? 'located' : (failed ? 'failed' : 'pending');
  renderManifest();
  drawMap();
}

/* ---------- UI & Management ---------- */
function addOrderObj(id, cust, loc) {
  const order = { id, cust, loc, coords: null, status: 'pending' };
  orders.push(order);
  queueGeocode(order);
  return order;
}

function renderManifest() {
  const container = document.getElementById('manifest');
  if (!container) return;

  const pending = orders.filter(o => o.status === 'pending').length;
  document.getElementById('import-status').textContent = 
    `Total orders: ${orders.length}${pending > 0 ? ` · Resolving ${pending} location(s)...` : ' · Processing complete.'}`;

  container.innerHTML = orders.map(o => `
    <div class="order-item">
      <strong>${o.id}</strong> — ${o.loc}
      <span class="status-badge status-${o.status}">${o.status}</span>
    </div>
  `).join('');
}

function drawMap() {
  const svg = document.getElementById('map');
  if (!svg) return;
  
  // Render map points for located orders
  const points = orders.filter(o => o.coords).map(o => {
    // Basic Mercator projection offset mapping for valley coordinates
    const x = ((o.coords.lng - 85.15) / (85.55 - 85.15)) * 600;
    const y = ((27.85 - o.coords.lat) / (27.85 - 27.55)) * 500;
    return `<circle cx="${x}" cy="${y}" r="6" fill="#e8590c" /><text x="${x+8}" y="${y+4}" font-size="10">${o.id}</text>`;
  }).join('');

  svg.innerHTML = points;
}

function tick() {
  document.getElementById('clock').textContent =
    "Dispatch Desk · " + new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

function seed() {
  [
    ["TCS123456NJ", "Customer A", "Kalimati, near the vegetable market"],
    ["KTM001234", "Customer B", "Tripureshwor"],
    ["HD001234", "Customer C", "Teku"],
    ["SSO0123UNP", "Customer D", "Sankhamul, Lalitpur side"]
  ].forEach(([id, cust, loc]) => addOrderObj(id, cust, loc));
}

/* ---------- Initialization ---------- */
tick();
setInterval(tick, 30000);
seed();
</script>
</body>
</html>
